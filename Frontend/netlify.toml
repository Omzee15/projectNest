# Netlify Configuration for ProjectNest Frontend

# Build settings
[build]
  # Directory where the built files are located
  publish = "dist"
  
  # Build command with clean install and memory optimization
  command = "npm ci --include=optional && npm run build"
  
  # Environment variables for build
  [build.environment]
    # Increase Node memory limit to prevent out-of-memory errors
    NODE_OPTIONS = "--max_old_space_size=4096"

# Redirect all requests to index.html for client-side routing (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Set custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Desktop app downloads (TodoBar menu bar app)
[[headers]]
  for = "/downloads/*.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"
