# Netlify Configuration for ProjectNest Frontend

# Build settings
[build]
  # Directory where the built files are located
  publish = "dist"
  
  # Build command with memory optimization
  command = "npm run build"
  
  # Environment variables for build
  [build.environment]
    # Increase Node memory limit to prevent out-of-memory errors
    NODE_OPTIONS = "--max_old_space_size=4096"
    # Use npm ci for faster, more reliable installs
    NPM_FLAGS = "--legacy-peer-deps"

# Redirect all requests to index.html for client-side routing (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Set custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
